<h2>Submissions</h2>

{% for sub in submissions %}
  <div style="border:1px solid black; margin:10px; padding:10px;">
    <p>Student: {{ sub.assignment.student.user.email }}</p>
    <p>Work: {{ sub.assignment.work_type.name }}</p>

    <a href="{{ sub.screenshot.url }}" target="_blank">
      View Screenshot
    </a>

    <form method="post" action="{% url 'verify_submission' sub.id %}">
      {% csrf_token %}
      <button type="submit">Verify</button>
    </form>
  </div>
{% endfor %}
