{% extends "layouts/staff_layout.html" %}
{% block content %}

<h2>Penalty Dashboard</h2>

<form method="get">
    <select name="course" onchange="this.form.submit()">
        <option value="">All Courses</option>
        {% for course in courses %}
            <option value="{{ course.id }}"
                {% if course.id|stringformat:"s" == selected_course %}
                    selected
                {% endif %}
            >
                {{ course.name }}
            </option>
        {% endfor %}
    </select>
</form>

<hr>

<table border="1" cellpadding="8">
    <tr>
        <th>Student</th>
        <th>Email</th>
        <th>Total Unpaid Fine</th>
        <th>Action</th>
    </tr>

    {% for student in students %}
    <tr>
        <td>{{ student.user.get_full_name }}</td>
        <td>{{ student.user.email }}</td>
        <td>₹ {{ student.total_unpaid|default:0 }}</td>
        <td>
            <a href="{% url 'student_detail' student.id %}">
                View Details
            </a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
