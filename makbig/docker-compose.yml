
services:

  db:
    image: postgres:16
    container_name: makbig-postgres
    restart: always
    environment:
      POSTGRES_DB: makbig_db
      POSTGRES_USER: makbig_user
      POSTGRES_PASSWORD: strongpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: makbig-redis
    ports:
      - "6379:6379"

  celery:
    build: .
    command: celery -A makbig worker -l info
    depends_on:
      - redis
      - db

volumes:
  postgres_data: