{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Makbig</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Raleway:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg:        #050c1a;
            --bg2:       #081022;
            --bg3:       #0b142a;
            --frost:     #0f1e3c;
            --ice:       #c7d9ff;
            --ice2:      #90abf5;
            --accent:    #c7d9ff;
            --accent3:   #3b5bdb;
            --grad:      linear-gradient(135deg, #0b1a4f 0%, #1e40af 45%, #f0f4ff 100%);
            --grad-soft: linear-gradient(135deg, rgba(199,217,255,.08) 0%, rgba(30,64,175,.12) 100%);
            --text:      #e8eeff;
            --text-soft: #7a96cc;
            --border:    rgba(144,171,245,.2);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { height: 100%; }

        body {
            font-family: 'Raleway', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background dot grid */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0;
            background-image: radial-gradient(circle, rgba(144,171,245,.06) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        /* Top-right orb */
        body::after {
            content: '';
            position: fixed; top: -30%; right: -15%;
            width: 70vw; height: 70vw; border-radius: 50%; z-index: 0;
            background: radial-gradient(circle, rgba(26,63,197,.18) 0%, rgba(144,171,245,.05) 55%, transparent 75%);
            pointer-events: none;
        }

        .grain {
            position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .016;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 180px 180px;
        }

        .orb2 {
            position: fixed; bottom: -20%; left: -10%;
            width: 50vw; height: 50vw; border-radius: 50%; z-index: 0;
            background: radial-gradient(circle, rgba(59,91,219,.12) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Card */
        .login-card {
            position: relative; z-index: 2;
            background: var(--frost);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 2.8rem 2.4rem;
            width: 100%;
            max-width: 420px;
            margin: 1.5rem;
            box-shadow: 0 24px 64px rgba(10,20,60,.5), 0 1px 0 rgba(144,171,245,.1) inset;
            animation: cardIn .7s cubic-bezier(.22,1,.36,1) .2s both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px) scale(.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .login-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 3px; border-radius: 20px 20px 0 0;
            background: var(--grad);
        }

        /* Brand */
        .brand {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.2rem; letter-spacing: .12em;
            background: var(--grad);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: .2rem;
            animation: riseUp .5s ease .5s both;
        }

        .portal-badge {
            display: inline-flex; align-items: center; gap: .45rem;
            background: rgba(144,171,245,.08); border: 1px solid rgba(144,171,245,.2);
            color: var(--text-soft); padding: .22rem .8rem; border-radius: 100px;
            font-size: .64rem; letter-spacing: .18em; text-transform: uppercase;
            margin-bottom: 2rem;
            animation: riseUp .5s ease .65s both;
        }
        .portal-badge i { color: var(--accent3); font-size: .6rem; }

        /* Form groups */
        .form-group {
            margin-bottom: 1.2rem;
            animation: riseUp .5s ease both;
        }
        .form-group:nth-child(1) { animation-delay: .75s; }
        .form-group:nth-child(2) { animation-delay: .85s; }

        .form-group label {
            display: block;
            font-size: .68rem; letter-spacing: .14em; text-transform: uppercase;
            color: var(--text-soft); margin-bottom: .45rem; font-weight: 600;
        }

        .form-group input {
            width: 100%;
            background: rgba(5,12,26,.6);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: .75rem 1rem;
            color: var(--text);
            font-family: 'Raleway', sans-serif;
            font-size: .88rem;
            outline: none;
            transition: border-color .25s, box-shadow .25s, background .25s;
        }
        .form-group input:focus {
            border-color: rgba(144,171,245,.5);
            background: rgba(5,12,26,.85);
            box-shadow: 0 0 0 3px rgba(59,91,219,.15);
        }
        .form-group input::placeholder { color: var(--text-soft); opacity: .5; }

        /* Password wrapper */
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 3.5rem; }
        .toggle-btn {
            position: absolute; right: 0; top: 0; bottom: 0;
            background: none; border: none; border-left: 1.5px solid var(--border);
            padding: 0 .9rem; cursor: pointer;
            color: var(--text-soft); font-size: .68rem; font-weight: 700;
            letter-spacing: .1em; text-transform: uppercase;
            font-family: 'Raleway', sans-serif;
            border-radius: 0 8px 8px 0;
            transition: color .25s, background .25s;
        }
        .toggle-btn:hover { color: var(--accent); background: rgba(144,171,245,.05); }

        /* Submit button */
        .login-btn {
            width: 100%; margin-top: .5rem;
            background: var(--grad); color: #fff;
            border: none; border-radius: 8px;
            padding: .88rem;
            font-family: 'Raleway', sans-serif;
            font-weight: 700; font-size: .82rem;
            letter-spacing: .12em; text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(26,63,197,.35);
            transition: transform .25s, box-shadow .25s, opacity .25s;
            animation: riseUp .5s ease .95s both;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(26,63,197,.45); opacity: .92; }
        .login-btn:active { transform: translateY(0); }

        /* Forgot link */
        .forgot-link {
            display: block; text-align: center; margin-top: 1.1rem;
            color: var(--text-soft); font-size: .78rem; text-decoration: none;
            transition: color .25s;
            animation: riseUp .5s ease 1.05s both;
        }
        .forgot-link:hover { color: var(--accent); }
        .forgot-link i { margin-right: .3rem; font-size: .7rem; }

        /* Messages */
        .error {
            margin-top: 1rem;
            background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.25);
            color: #fca5a5; border-radius: 8px; padding: .65rem .9rem;
            font-size: .8rem; line-height: 1.5;
            animation: riseUp .3s ease both;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin: 1.6rem 0;
        }

        .card-footer {
            text-align: center;
            font-size: .65rem; letter-spacing: .06em;
            color: rgba(122,150,204,.4);
            animation: riseUp .5s ease 1.1s both;
        }
        .card-footer i { margin-right: .3rem; }

        @keyframes riseUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        input:-webkit-autofill,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px #081022 inset;
            -webkit-text-fill-color: #e8eeff;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body>

<div class="grain"></div>
<div class="orb2"></div>

<div class="login-card">
    <div class="brand">Makbig</div>
    <div class="portal-badge"><i class="fa-solid fa-graduation-cap"></i> Student Portal</div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Email</label>
            {{ form.email }}
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="password-wrapper">
                {{ form.password }}
                <button type="button" class="toggle-btn" onclick="togglePassword(this)">Show</button>
            </div>
        </div>

        <button type="submit" class="login-btn">
            <i class="fa-solid fa-arrow-right-to-bracket" style="margin-right:.5rem;"></i>Login
        </button>
    </form>

    <a href="{% url 'student_forgot_password' %}" class="forgot-link">
        <i class="fa-regular fa-circle-question"></i>Forgot Password?
    </a>

    {% for message in messages %}
        <div class="error"><i class="fa-solid fa-circle-exclamation" style="margin-right:.4rem;"></i>{{ message }}</div>
    {% endfor %}

    <div class="divider"></div>
    <div class="card-footer"><i class="fa-solid fa-graduation-cap"></i>Student Access · Makbig &copy; 2025</div>
</div>

<script>
function togglePassword(btn) {
    const input = document.getElementById('id_password');
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Hide';
    } else {
        input.type = 'password';
        btn.textContent = 'Show';
    }
}
</script>
</body>
</html>
