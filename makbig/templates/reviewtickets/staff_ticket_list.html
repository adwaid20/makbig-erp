{% extends "layouts/staff_layout.html" %}
{% block content %}

<h4>Review Tickets</h4>

{% for ticket in tickets %}
<div class="card mb-3">
    <div class="card-body d-flex justify-content-between">

        <div>
            <strong>{{ ticket.student.user.email }}</strong><br>
            {{ ticket.message }}<br>
            <small class="text-muted">
                Review ID: {{ ticket.review_attendance.id }}
            </small>
        </div>

        <div class="text-end">
            <a href="{% url 'staff_student_review' ticket.review_attendance.student.id %}"
               class="btn btn-sm btn-primary">
                Open Review
            </a>

            <form method="post" action="{% url 'resolve_ticket' ticket.id %}" class="d-inline">
                {% csrf_token %}
                <button class="btn btn-sm btn-success">✔</button>
            </form>
        </div>

    </div>
</div>
{% empty %}
<p>No pending tickets.</p>
{% endfor %}

{% endblock %}
