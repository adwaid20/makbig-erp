{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | Makbig</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>
<div class="page-wrapper">

    <div class="login-card">
        <div class="brand">Makbig</div>
        <div class="subtitle">Reset Your Password</div>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>New Password</label>
                <div class="password-wrapper">
                    <input type="password" name="password" id="password" required>
                    <button type="button" class="toggle-btn" onclick="togglePassword('password')">
                        Show
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" name="confirm_password" id="confirm_password" required>
                    <button type="button" class="toggle-btn" onclick="togglePassword('confirm_password')">
                        Show
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn">
                Reset Password
            </button>
        </form>

        {% for message in messages %}
            <div class="error">{{ message }}</div>
        {% endfor %}
    </div>

</div>

<script>
function togglePassword(fieldId) {
    const input = document.getElementById(fieldId);
    input.type = input.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
