{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Makbig</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Raleway:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg:        #050c1a;
            --frost:     #0f1e3c;
            --grad:      linear-gradient(135deg, #0b1a4f 0%, #1e40af 45%, #f0f4ff 100%);
            --text:      #e8eeff;
            --text-soft: #7a96cc;
            --border:    rgba(144,171,245,.2);
            --accent3:   #3b5bdb;
            --ice2:      #90abf5;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Raleway', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }

        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0;
            background-image: radial-gradient(circle, rgba(144,171,245,.06) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        body::after {
            content: '';
            position: fixed; top: -30%; right: -15%;
            width: 70vw; height: 70vw; border-radius: 50%; z-index: 0;
            background: radial-gradient(circle, rgba(26,63,197,.18) 0%, rgba(144,171,245,.05) 55%, transparent 75%);
            pointer-events: none;
        }

        .grain {
            position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .016;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 180px 180px;
        }
        .orb2 {
            position: fixed; bottom: -20%; left: -10%;
            width: 50vw; height: 50vw; border-radius: 50%; z-index: 0;
            background: radial-gradient(circle, rgba(59,91,219,.12) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Card */
        .login-card {
            position: relative; z-index: 2;
            background: var(--frost);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 2.8rem 2.4rem;
            width: 100%; max-width: 420px;
            margin: 1.5rem;
            box-shadow: 0 24px 64px rgba(10,20,60,.5), 0 1px 0 rgba(144,171,245,.1) inset;
            animation: cardIn .7s cubic-bezier(.22,1,.36,1) .2s both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px) scale(.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .login-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 3px; border-radius: 20px 20px 0 0;
            background: var(--grad);
        }

        /* Brand */
        .brand {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.2rem; letter-spacing: .12em;
            background: var(--grad);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            line-height: 1; margin-bottom: .25rem;
            animation: riseUp .5s ease .5s both;
        }
        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.05rem; font-weight: 700;
            color: var(--text); margin-bottom: .3rem;
            animation: riseUp .5s ease .58s both;
        }
        .page-desc {
            font-size: .8rem; color: var(--text-soft);
            line-height: 1.65; margin-bottom: 1.8rem;
            animation: riseUp .5s ease .65s both;
        }

        /* Form groups */
        .form-group {
            margin-bottom: 1.2rem;
            animation: riseUp .5s ease both;
        }
        .form-group:nth-of-type(1) { animation-delay: .72s; }
        .form-group:nth-of-type(2) { animation-delay: .82s; }

        .form-group label {
            display: block;
            font-size: .68rem; letter-spacing: .14em; text-transform: uppercase;
            color: var(--text-soft); margin-bottom: .45rem; font-weight: 600;
        }

        /* Password wrapper */
        .password-wrapper { position: relative; }
        .password-wrapper input {
            width: 100%;
            background: rgba(5,12,26,.6);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: .75rem 3.5rem .75rem 1rem;
            color: var(--text);
            font-family: 'Raleway', sans-serif;
            font-size: .88rem; outline: none;
            transition: border-color .25s, box-shadow .25s, background .25s;
        }
        .password-wrapper input:focus {
            border-color: rgba(144,171,245,.5);
            background: rgba(5,12,26,.85);
            box-shadow: 0 0 0 3px rgba(59,91,219,.15);
        }
        .password-wrapper input::placeholder { color: var(--text-soft); opacity: .4; }

        .toggle-btn {
            position: absolute; right: 0; top: 0; bottom: 0;
            background: none; border: none; border-left: 1.5px solid var(--border);
            padding: 0 .9rem; cursor: pointer;
            color: var(--text-soft); font-size: .68rem; font-weight: 700;
            letter-spacing: .1em; text-transform: uppercase;
            font-family: 'Raleway', sans-serif;
            border-radius: 0 8px 8px 0;
            transition: color .25s, background .25s;
        }
        .toggle-btn:hover { color: var(--ice2); background: rgba(144,171,245,.05); }

        /* Password strength */
        .strength-wrap {
            margin-top: .5rem;
            display: none;
        }
        .strength-wrap.visible { display: block; }
        .strength-track {
            height: 3px; background: rgba(144,171,245,.08);
            border-radius: 2px; overflow: hidden; margin-bottom: .3rem;
        }
        .strength-bar {
            height: 100%; border-radius: 2px;
            transition: width .35s ease, background .35s ease;
            width: 0;
        }
        .strength-label {
            font-size: .62rem; letter-spacing: .1em;
            text-transform: uppercase; font-weight: 700;
        }

        /* Match indicator */
        .match-hint {
            font-size: .7rem; margin-top: .4rem;
            display: none; align-items: center; gap: .35rem;
        }
        .match-hint.visible { display: flex; }
        .match-hint i { font-size: .65rem; }

        /* Requirements list */
        .req-list {
            margin-top: .55rem;
            display: grid; grid-template-columns: 1fr 1fr; gap: .2rem .5rem;
        }
        .req {
            font-size: .68rem; color: var(--text-soft);
            display: flex; align-items: center; gap: .35rem;
            transition: color .25s;
        }
        .req i { font-size: .58rem; width: 10px; color: rgba(144,171,245,.2); transition: color .25s; }
        .req.met { color: #86efac; }
        .req.met i { color: #22c55e; }

        /* Submit */
        .login-btn {
            width: 100%; margin-top: .6rem;
            background: var(--grad); color: #fff;
            border: none; border-radius: 8px;
            padding: .88rem;
            font-family: 'Raleway', sans-serif;
            font-weight: 700; font-size: .82rem;
            letter-spacing: .12em; text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(26,63,197,.35);
            transition: transform .25s, box-shadow .25s, opacity .25s;
            animation: riseUp .5s ease .92s both;
            display: flex; align-items: center; justify-content: center; gap: .55rem;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(26,63,197,.45); opacity: .92; }
        .login-btn:active { transform: translateY(0); }
        .login-btn:disabled { opacity: .38; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Messages */
        .msg {
            margin-top: 1rem;
            border-radius: 8px; padding: .65rem .9rem;
            font-size: .8rem; line-height: 1.5;
            display: flex; align-items: flex-start; gap: .5rem;
            animation: riseUp .3s ease both;
        }
        .msg.error   { background: rgba(239,68,68,.08);  border: 1px solid rgba(239,68,68,.25);  color: #fca5a5; }
        .msg.success { background: rgba(34,197,94,.08);  border: 1px solid rgba(34,197,94,.25);  color: #86efac; }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin: 1.6rem 0;
        }
        .card-footer {
            text-align: center;
            font-size: .65rem; letter-spacing: .06em;
            color: rgba(122,150,204,.35);
            animation: riseUp .5s ease 1s both;
        }
        .card-footer i { margin-right: .3rem; }

        @keyframes riseUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        input:-webkit-autofill,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px #081022 inset;
            -webkit-text-fill-color: #e8eeff;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body>

<div class="grain"></div>
<div class="orb2"></div>

<div class="login-card">

    <div class="brand">Makbig</div>
    <div class="page-title">Set a new password</div>
    <p class="page-desc">Choose a strong password you haven't used before.</p>

    <form method="POST" id="resetForm">
        {% csrf_token %}

        <!-- New Password -->
        <div class="form-group">
            <label>New Password</label>
            <div class="password-wrapper">
                <input type="password" name="password" id="password"
                       placeholder="Min. 8 characters" required
                       oninput="checkStrength(this.value); checkMatch()">
                <button type="button" class="toggle-btn" onclick="togglePassword('password', this)">Show</button>
            </div>

            <!-- Strength meter -->
            <div class="strength-wrap" id="strengthWrap">
                <div class="strength-track">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
                <span class="strength-label" id="strengthLabel"></span>
            </div>

            <!-- Requirements -->
            <div class="req-list">
                <div class="req" id="req-len"><i class="fa-solid fa-circle"></i> 8+ characters</div>
                <div class="req" id="req-upper"><i class="fa-solid fa-circle"></i> Uppercase</div>
                <div class="req" id="req-num"><i class="fa-solid fa-circle"></i> Number</div>
                <div class="req" id="req-special"><i class="fa-solid fa-circle"></i> Special char</div>
            </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
            <label>Confirm Password</label>
            <div class="password-wrapper">
                <input type="password" name="confirm_password" id="confirm_password"
                       placeholder="Re-enter password" required
                       oninput="checkMatch()">
                <button type="button" class="toggle-btn" onclick="togglePassword('confirm_password', this)">Show</button>
            </div>

            <!-- Match hint -->
            <div class="match-hint" id="matchHint">
                <i class="fa-solid fa-circle-check" id="matchIcon"></i>
                <span id="matchText"></span>
            </div>
        </div>

        <button type="submit" class="login-btn" id="submitBtn" disabled>
            <i class="fa-solid fa-lock"></i>
            Reset Password
        </button>
    </form>

    {% for message in messages %}
        <div class="msg error">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ message }}</span>
        </div>
    {% endfor %}

    <div class="divider"></div>
    <div class="card-footer"><i class="fa-solid fa-shield-halved"></i>Secure Reset · Makbig &copy; 2025</div>

</div>

<script>
function togglePassword(fieldId, btn) {
    const input = document.getElementById(fieldId);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    btn.textContent = isHidden ? 'Hide' : 'Show';
}

function checkStrength(val) {
    const wrap  = document.getElementById('strengthWrap');
    const bar   = document.getElementById('strengthBar');
    const label = document.getElementById('strengthLabel');

    if (!val) { wrap.classList.remove('visible'); return; }
    wrap.classList.add('visible');

    const checks = {
        len:     val.length >= 8,
        upper:   /[A-Z]/.test(val),
        num:     /[0-9]/.test(val),
        special: /[^A-Za-z0-9]/.test(val),
    };

    // Update requirement pills
    Object.entries(checks).forEach(([key, met]) => {
        const el = document.getElementById('req-' + key);
        if (el) el.classList.toggle('met', met);
    });

    const score = Object.values(checks).filter(Boolean).length;
    const levels = [
        { w: '20%', color: '#ef4444', text: 'Weak'      },
        { w: '40%', color: '#f97316', text: 'Fair'      },
        { w: '65%', color: '#f59e0b', text: 'Good'      },
        { w: '85%', color: '#22c55e', text: 'Strong'    },
        { w: '100%',color: '#22c55e', text: 'Very Strong'},
    ];
    const lvl = levels[Math.max(0, score - 1)];
    bar.style.width      = lvl.w;
    bar.style.background = lvl.color;
    label.textContent    = lvl.text;
    label.style.color    = lvl.color;

    updateSubmit();
}

function checkMatch() {
    const pw  = document.getElementById('password').value;
    const cpw = document.getElementById('confirm_password').value;
    const hint = document.getElementById('matchHint');
    const icon = document.getElementById('matchIcon');
    const text = document.getElementById('matchText');

    if (!cpw) { hint.classList.remove('visible'); updateSubmit(); return; }

    hint.classList.add('visible');
    const match = pw === cpw;

    icon.className = match
        ? 'fa-solid fa-circle-check'
        : 'fa-solid fa-circle-xmark';
    icon.style.color = match ? '#22c55e' : '#ef4444';
    text.textContent = match ? 'Passwords match' : 'Passwords do not match';
    text.style.color = match ? '#86efac'  : '#fca5a5';

    updateSubmit();
}

function updateSubmit() {
    const pw    = document.getElementById('password').value;
    const cpw   = document.getElementById('confirm_password').value;
    const valid = pw.length >= 8 && pw === cpw;
    document.getElementById('submitBtn').disabled = !valid;
}
</script>

</body>
</html>
